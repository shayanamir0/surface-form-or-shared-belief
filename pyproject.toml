[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behavioural-test"
version = "0.1.0"
description = "Behavioral tests of surface-form versus shared-belief agreement in LLM judges"
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "datasets>=5.0.1",
  "numpy>=2.0",
  "openai>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]
figures = [
  "matplotlib>=3.9",
]

[project.scripts]
behavioural-test = "behavioural_test.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/behavioural_test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"figures/build.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
